<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>ROE Exam Assistant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-4">

    <h1 class="text-center mb-4">
        ROE Exam Assistant
    </h1>


    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <label class="form-label fw-bold">
                Question Type
            </label>

            <select
                id="questionType"
                class="form-select"
            >

                <option value="q1">
                    Q1 — LLM Verification
                </option>

                <option value="q2">
                    Q2 — Dataset / API Insights
                </option>

                <option value="q3">
                    Q3 — Organization Analysis
                </option>

                <option value="q4">
                    Q4 — Short Essay
                </option>

            </select>

        </div>

    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <label class="form-label fw-bold">
                Exam Question
            </label>

            <textarea
                id="question"
                class="form-control"
                rows="5"
                placeholder="Paste the exact exam question here..."
            ></textarea>

        </div>

    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <label class="form-label fw-bold">
                Material
            </label>

            <textarea
                id="material"
                class="form-control"
                rows="12"
                placeholder="Paste the article, dataset, API response, organizational material, or other supplied information here..."
            ></textarea>

        </div>

    </div>


    <button
        id="analyzeButton"
        class="btn btn-primary btn-lg w-100"
        onclick="analyze()"
    >

        Generate Analysis

    </button>


    <div class="card shadow-sm mt-4">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center">

                <h4>
                    Result
                </h4>

                <button
                    class="btn btn-outline-secondary"
                    onclick="copyResult()"
                >

                    Copy

                </button>

            </div>

            <hr>

            <pre
                id="result"
                style="white-space: pre-wrap;"
            >Your answer will appear here.</pre>

        </div>

    </div>


</div>


<script src="/static/script.js"></script>


</body>

</html>
